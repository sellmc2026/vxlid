<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VXLID?? Is that YOU?!?</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background-image: url("vxlid.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #backgroundButton {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: none;
            padding: 0;

            background: transparent;

            cursor: pointer;
        }
    </style>
</head>

<body>

    <button id="backgroundButton" aria-label="Play sound"></button>

    <script>

        function sound() {

            let _n = Math.floor(Math.random() * 5) + 1;

            let rawSound;


            if (_n === 1) {

                rawSound = "anime-ahh.mp3";

            } else if (_n === 2) {

                rawSound = "vine-boom.mp3";

            } else if (_n === 3) {

                rawSound = "rizz-sound-effect.mp3";

            } else if (_n === 4) {

                rawSound = "cat-laught-meme-1.mp3";

            } else if (_n === 5) {

                rawSound = "dry-fart.mp3";

            }


            console.log("Random number:", _n);
            console.log("Playing:", rawSound);


            let audio = new Audio(rawSound);

            audio.play();

        }


        let backgroundButton =
            document.querySelector("#backgroundButton");


        backgroundButton.addEventListener(
            "click",
            function() {

                sound();

            }
        );

    </script>

</body>
</html>
