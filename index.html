<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>VXLID?? Is that YOU?!?</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background-image: url("vxlid.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            background-color: #000000;
        }


        body {
            min-height: 100dvh;
        }


        #backgroundButton {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100dvh;

            border: none;
            padding: 0;
            margin: 0;

            background: transparent;

            cursor: pointer;

            /*
             * Removes the blue/gray tap highlight
             * that some mobile browsers add.
             */
            -webkit-tap-highlight-color: transparent;

            /*
             * Makes touch interaction respond immediately.
             */
            touch-action: manipulation;
        }

    </style>
</head>


<body>

    <div
        id="backgroundButton"
        aria-label="Play sound"
    ></div>


    <script>

        console.log("JavaScript started!");


        const backgroundButton =
            document.querySelector("#backgroundButton");


        function sound() {

            let _n =
                Math.floor(Math.random() * 5) + 1;

            let rawSound;


            if (_n === 1) {

                rawSound = "anime-ahh.mp3";

            } else if (_n === 2) {

                rawSound = "vine-boom.mp3";

            } else if (_n === 3) {

                rawSound = "rizz-sound-effect.mp3";

            } else if (_n === 4) {

                rawSound = "cat-laugh-meme-1.mp3";

            } else {

                rawSound = "dry-fart.mp3";

            }


            console.log("Random number:", _n);
            console.log("Trying to play:", rawSound);


            const audio =
                new Audio(rawSound);


            audio.addEventListener(
                "canplaythrough",
                function() {

                    console.log(
                        "Audio loaded successfully:",
                        rawSound
                    );

                }
            );


            audio.addEventListener(
                "error",
                function() {

                    console.error(
                        "COULD NOT LOAD AUDIO:",
                        rawSound
                    );

                }
            );


            audio.play()
                .then(function() {

                    console.log(
                        "Audio playing!"
                    );

                })
                .catch(function(error) {

                    console.error(
                        "AUDIO PLAY ERROR:",
                        error
                    );

                });

        }


        /*
         * pointerdown works for:
         *
         * - Desktop mouse
         * - Mobile touchscreen
         * - Stylus
         *
         * So you don't need separate
         * desktop and mobile handlers.
         */

        backgroundButton.addEventListener(
            "pointerdown",
            function(event) {

                console.log(
                    "BACKGROUND PRESSED!",
                    event.pointerType
                );

                sound();

            }
        );

    </script>

</body>
</html>
